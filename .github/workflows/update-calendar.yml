
name: Update MotoGP calendar

on:
  schedule:
    - cron: "37 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-motogp-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile update_calendar.py

      - name: Update MotoGP calendar
        run: python update_calendar.py

      - name: Validate generated calendar
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("motogp-calendar.ics")

          if not path.exists():
              raise SystemExit("ICS file was not generated")

          content = path.read_text(encoding="utf-8")

          if not content.startswith("BEGIN:VCALENDAR"):
              raise SystemExit("Invalid ICS header")

          if not content.rstrip().endswith("END:VCALENDAR"):
              raise SystemExit("Invalid ICS footer")

          events = content.count("BEGIN:VEVENT")
          alarms = content.count("BEGIN:VALARM")

          if events < 2:
              raise SystemExit("Too few MotoGP events")

          if events != alarms:
              raise SystemExit("Some events are missing alarms")

          if content.count("TRIGGER:-PT30M") != events:
              raise SystemExit("Incorrect alarm configuration")

          print(f"ICS validation passed: {events} events")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add motogp-calendar.ics

          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Auto-update MotoGP calendar"
            git push
          fi
